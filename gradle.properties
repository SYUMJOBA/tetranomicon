# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

## Environment Properties

# Parchment mappings (layered on official Mojang mappings)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# The NeoForge version
neo_version=21.1.228
neo_version_range=[21.1.0,)
loader_version_range=[1,)

## Mod Properties

mod_id=tetranomicon
mod_name=Tetranomicon
mod_license=LGPL-3.0
mod_version=1.6.2
mod_group_id=com.syric.tetranomicon
mod_authors=Syric
mod_description=Adds Tetra support to materials from various other mods.

## Dependency versions

# mutil (published to mavenLocal from the mutil repo)
mutil_version=1.21.1-6.3.1
mutil_version_range=[6.3.1,]

# tetra (published to mavenLocal from the tetra repo)
tetra_version=1.21.1-6.13.0
tetra_version_range=[6.13.0,]
