modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Mickelus made most of the templates and Tetra itself. Credits for the other mods' materials go to their respective authors. The Netherite Opal texture is adapted from CriativeMan1's Black Opal texture for the Ores Above Diamonds mod."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mutil"
type="required"
versionRange="${mutil_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tetra"
type="required"
versionRange="${tetra_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="oresabovediamonds"
type="optional"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="betternether"
type="optional"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
